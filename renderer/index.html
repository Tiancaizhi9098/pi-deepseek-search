<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="pi-plugin-chrome" content="v2" />
    <title>DeepSeek 联网搜索</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #181818;
        --surface: #212121;
        --fg: #ffffff;
        --muted: color-mix(in oklab, #ffffff 52%, transparent);
        --border: color-mix(in oklab, #ffffff 10%, transparent);
        --accent: #ffffff;
        --ok: #4ade80;
        --err: #f87171;
      }
      :root[data-base="light"] {
        color-scheme: light;
        --bg: #ffffff;
        --surface: #f9f9f9;
        --fg: #1a1c1f;
        --muted: #5d5d5d;
        --border: color-mix(in oklab, #1a1c1f 10%, transparent);
        --accent: #1a1c1f;
        --ok: #15803d;
        --err: #b91c1c;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: var(--pi-plugin-titlebar-height, 0px) 16px 16px;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        background: var(--surface);
        max-width: 560px;
        margin: 0 auto;
      }
      h2 { margin: 0 0 4px; font-size: 16px; font-weight: 560; }
      .sub { margin: 0 0 14px; color: var(--muted); }
      label { display: block; margin: 12px 0 4px; font-weight: 500; }
      .hint { color: var(--muted); font-size: 12px; margin-top: 3px; }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }
      input:focus-visible { outline: 2px solid color-mix(in oklab, var(--accent) 55%, transparent); outline-offset: 1px; }
      .row { display: flex; gap: 10px; }
      .row > div { flex: 1; }
      .keyrow { display: flex; gap: 8px; }
      .keyrow input { flex: 1; }
      button {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 8px 14px;
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        font: inherit;
      }
      button.primary { background: var(--accent); color: var(--bg); }
      button:hover { opacity: 0.82; }
      button:disabled { opacity: 0.45; cursor: default; }
      .actions { display: flex; gap: 8px; margin-top: 16px; align-items: center; }
      #status { margin-left: auto; font-size: 12px; color: var(--muted); text-align: right; }
      #status.ok { color: var(--ok); }
      #status.err { color: var(--err); }
      .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); margin-left: 6px; }
      .badge.on { color: var(--ok); }
      .badge.off { color: var(--err); }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>DeepSeek 联网搜索 <span id="badge" class="badge off">未配置</span></h2>
      <p class="sub">为智能体提供联网搜索与网页抓取（DeepSeek 官方 Search / Fetch API）。</p>

      <label for="apiKey">DeepSeek API Key</label>
      <div class="keyrow">
        <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-..." />
        <button id="toggle" type="button">显示</button>
      </div>
      <div class="hint" id="keyHint">在 <a href="https://platform.deepseek.com/api_keys" id="keyLink">platform.deepseek.com/api_keys</a> 获取。留空表示保持已保存的 Key 不变。</div>

      <div class="row">
        <div>
          <label for="defaultCount">默认搜索条数（1–50）</label>
          <input id="defaultCount" type="number" min="1" max="50" step="1" />
        </div>
        <div>
          <label for="maxChars">单次最大返回字符数</label>
          <input id="maxChars" type="number" min="2000" max="200000" step="1000" />
        </div>
      </div>

      <div class="actions">
        <button id="save" class="primary" type="button">保存</button>
        <button id="test" type="button">测试连接</button>
        <button id="clear" type="button">清除 Key</button>
        <span id="status"></span>
      </div>
      <div class="hint" style="margin-top:12px">Key 以明文保存在本机插件数据目录；仅会发送到 api.deepseek.com。测试连接会发起 1 次搜索（成功约 0.005 元）。</div>
    </div>

    <script>
      const bridge = window.pluginBridge;
      const $ = (id) => document.getElementById(id);
      const apply = (appearance) => {
        const base = appearance?.base;
        document.documentElement.dataset.base = base === "light" || base === "dark"
          ? base
          : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      };
      bridge?.on("appearance:changed", apply);
      bridge?.invoke("app.getAppearance").then(apply).catch(() => apply(null));

      function setStatus(text, kind) {
        const s = $("status");
        s.textContent = text || "";
        s.className = kind || "";
      }
      function render(state) {
        const badge = $("badge");
        badge.textContent = state.hasKey ? "已配置" : "未配置";
        badge.className = "badge " + (state.hasKey ? "on" : "off");
        $("apiKey").value = "";
        $("apiKey").placeholder = state.hasKey ? `已保存：${state.keyHint}（留空保持不变）` : "sk-...";
        $("defaultCount").value = state.defaultCount;
        $("maxChars").value = state.maxChars;
      }
      async function call(channel, payload) {
        if (!bridge?.invoke) throw new Error("pluginBridge 不可用（请在 PI-Desktop 中打开）");
        return bridge.invoke(channel, payload || {});
      }
      function form() {
        return {
          apiKey: $("apiKey").value.trim(),
          defaultCount: Number($("defaultCount").value),
          maxChars: Number($("maxChars").value),
        };
      }
      async function busy(fn) {
        for (const id of ["save", "test", "clear"]) $(id).disabled = true;
        try { await fn(); } finally { for (const id of ["save", "test", "clear"]) $(id).disabled = false; }
      }

      $("toggle").addEventListener("click", () => {
        const input = $("apiKey");
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        $("toggle").textContent = show ? "隐藏" : "显示";
      });
      $("keyLink").addEventListener("click", (e) => {
        e.preventDefault();
        call("shell.openExternal", { url: "https://platform.deepseek.com/api_keys" }).catch(() => {});
      });
      $("save").addEventListener("click", () => busy(async () => {
        try {
          render(await call("ds.save", form()));
          setStatus("已保存", "ok");
        } catch (e) { setStatus(e.message || String(e), "err"); }
      }));
      $("clear").addEventListener("click", () => busy(async () => {
        try {
          render(await call("ds.save", { clearKey: true }));
          setStatus("已清除 Key", "ok");
        } catch (e) { setStatus(e.message || String(e), "err"); }
      }));
      $("test").addEventListener("click", () => busy(async () => {
        setStatus("测试中…");
        try {
          const r = await call("ds.test", { apiKey: $("apiKey").value.trim() });
          setStatus(r.ok ? `连接成功（返回 ${r.count} 条结果）` : r.message, r.ok ? "ok" : "err");
        } catch (e) { setStatus(e.message || String(e), "err"); }
      }));

      call("ds.get").then(render).catch((e) => setStatus(e.message || String(e), "err"));
    </script>
  </body>
</html>
